<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>neetbridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><img src="../icons/icon48.png" alt="" width="26" height="26"><span>neet<b>bridge</b></span></div>
    <div class="statuses">
      <button class="pill" id="ncPill" title="NeetCode session"><span class="dot" id="ncDot"></span><span id="ncStatus">NeetCode</span></button>
      <button class="pill" id="lcPill" title="LeetCode session"><span class="dot" id="lcDot"></span><span id="lcStatus">LeetCode</span></button>
    </div>
  </header>

  <section class="directions">
    <div class="card">
      <div class="card-title"><span class="site nc">NeetCode</span><span class="arr">→</span><span class="site lc">LeetCode</span></div>
      <label class="field">When a NeetCode submission is accepted
        <select id="nc2lc">
          <option value="off">do nothing</option>
          <option value="submit">submit the code to LeetCode</option>
        </select>
      </label>
      <button id="bulk" class="sync">Sync everything I solved on NeetCode</button>
    </div>
    <div class="card">
      <div class="card-title"><span class="site lc">LeetCode</span><span class="arr">→</span><span class="site nc">NeetCode</span></div>
      <label class="field">When a LeetCode submission is accepted
        <select id="lc2nc">
          <option value="off">do nothing</option>
          <option value="mark">tick the NeetCode roadmap</option>
          <option value="submit">tick + submit code to NeetCode</option>
        </select>
      </label>
      <button id="bulkReverse" class="sync">Sync everything I solved on LeetCode</button>
    </div>
  </section>

  <section class="bulkbar">
    <label class="check" title="Sync buttons only collect and list what they would do; nothing is submitted or ticked."><input type="checkbox" id="dryRun" checked> Preview only</label>
    <span id="bulkText" class="small muted"></span>
    <button id="abortBulk" class="mini" hidden>Stop</button>
  </section>

  <section class="queue">
    <div class="row" id="pausedRow" hidden>
      <span class="dot warn"></span>
      <span id="pausedText" class="small"></span>
      <button class="link" id="resume">Resume</button>
    </div>
    <div class="row small" id="queueRow">
      <span class="dot idle" id="queueDot"></span>
      <span id="queueText">Queue empty</span>
      <button class="link" id="clearQueue" hidden>clear</button>
    </div>
  </section>

  <details class="settings">
    <summary>Settings</summary>
    <label class="check"><input type="checkbox" id="allowPremium"> Also submit LeetCode Premium problems (needs Premium)</label>
    <label class="check"><input type="checkbox" id="notify"> Desktop notification with every verdict</label>
    <label class="check">Wait <input type="number" id="delaySec" min="10" max="600" step="5"> s between submissions</label>
  </details>

  <section class="log">
    <div class="row">
      <strong>Recent</strong>
      <span class="small muted" id="logCount"></span>
      <button class="link" id="clearLog">clear</button>
    </div>
    <ul id="log"></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
